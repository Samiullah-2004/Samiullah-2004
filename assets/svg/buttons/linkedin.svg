<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="155" height="48" viewBox="0 0 155 48" role="img" aria-labelledby="title desc">
<title id="title">LinkedIn</title>
<desc id="desc">LinkedIn</desc>
<defs><style>
.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.display{font-family:'Anton', Impact, 'Arial Narrow Bold', sans-serif}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(112%)}to{transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(1);opacity:.6}70%,100%{transform:scale(3.4);opacity:0}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.fu{animation:fadeUp .9s cubic-bezier(0.16, 1, 0.3, 1) both}
.fi{animation:fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) both}
.rv{transform-box:fill-box;animation:rise 1s cubic-bezier(0.16, 1, 0.3, 1) both}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s cubic-bezier(0,0,.2,1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.label{font:600 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#ededed}
@keyframes shine{0%{transform:translateX(0) skewX(-20deg)}35%,100%{transform:translateX(295px) skewX(-20deg)}}
.shine{animation:shine 4s cubic-bezier(.45,0,.25,1) 1.4s infinite both}
@keyframes edge{0%,100%{stroke:#ffffff;stroke-opacity:.16}50%{stroke:#2ef06a;stroke-opacity:.55}}
.edge{animation:edge 4s ease-in-out 0.6s infinite}
@keyframes nudge{0%,70%,100%{transform:none}80%{transform:translate(2px,-2px)}}
.nudge{animation:nudge 3s ease-in-out 1.8s infinite}
</style><clipPath id="pill"><rect width="155" height="48" rx="24"/></clipPath><linearGradient id="shineGrad" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
