<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="125" viewBox="0 0 1000 125" role="img" aria-labelledby="title desc">
<title id="title">03 Work: Selected Projects</title>
<desc id="desc">A few products I've designed, built and deployed, from a live AI video SaaS to RAG chatbots and real-time apps.</desc>
<defs><style>@font-face{font-family:'Anton';src:url(data:font/woff2;base64,) format('woff2')}
.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.display{font-family:'Anton', Impact, 'Arial Narrow Bold', sans-serif}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(112%)}to{transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(1);opacity:.6}70%,100%{transform:scale(3.4);opacity:0}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.fu{animation:fadeUp .9s cubic-bezier(0.16, 1, 0.3, 1) both}
.fi{animation:fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) both}
.rv{transform-box:fill-box;animation:rise 1s cubic-bezier(0.16, 1, 0.3, 1) both}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s cubic-bezier(0,0,.2,1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.eb{font:600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;letter-spacing:.22em;fill:#9a9a9a;text-transform:uppercase}
.eb-i{font:600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;letter-spacing:.22em;fill:#2ef06a;text-transform:uppercase}
.aside{font-size:15px;fill:#9a9a9a}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.grow{transform-origin:35px 0;animation:grow .8s cubic-bezier(0.16, 1, 0.3, 1) .15s both}
</style><clipPath id="clipa"><rect x="57.6" y="35.3" width="482.24" height="76.8"/></clipPath></defs>
