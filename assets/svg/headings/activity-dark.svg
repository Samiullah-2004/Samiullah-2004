<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="125" viewBox="0 0 1000 125" role="img" aria-labelledby="title desc">
<title id="title">06 Activity: On GitHub</title>
<desc id="desc">Commits, streaks and contributions, refreshed automatically.</desc>
<defs><style>@font-face{font-family:'Anton';src:url(data:font/woff2;base64,) format('woff2')}
.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.display{font-family:'Anton', Impact, 'Arial Narrow Bold', sans-serif}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(112%)}to{transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(1);opacity:.6}70%,100%{transform:scale(3.4);opacity:0}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.fu{animation:fadeUp .9s cubic-bezier(0.16, 1, 0.3, 1) both}
.fi{animation:fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) both}
.rv{transform-box:fill-box;animation:rise 1s cubic-bezier(0.16, 1, 0.3, 1) both}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s cubic-bezier(0,0,.2,1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.eb{font:600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;letter-spacing:.22em;fill:#9a9a9a;text-transform:uppercase}
.eb-i{font:600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;letter-spacing:.22em;fill:#2ef06a;text-transform:uppercase}
.aside{font-size:15px;fill:#9a9a9a}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.grow{transform-origin:35px 0;animation:grow .8s cubic-bezier(0.16, 1, 0.3, 1) .15s both}
</style><clipPath id="clipg"><rect x="57.6" y="35.3" width="254.52" height="76.8"/></clipPath></defs>
<g class="fi">
<text class="eb-i" x="4" y="22">06</text>
<line class="grow" x1="35" y1="18" x2="67" y2="18" stroke="#ededed" stroke-opacity=".22"/>
<text class="eb" x="79" y="22">Activity</text>
</g>
<g class="fi" style="animation-delay:.1s"><g style="transform-origin:25px 75px;animation:spin 6s linear infinite"><rect x="21.64" y="57.36" width="6.72" height="17.64" rx="3.36" fill="#2ef06a" opacity="0.4" transform="rotate(0 25 75)"/><rect x="21.64" y="57.36" width="6.72" height="17.64" rx="3.36" fill="#2ef06a" opacity="0.52" transform="rotate(60 25 75)"/><rect x="21.64" y="57.36" width="6.72" height="17.64" rx="3.36" fill="#2ef06a" opacity="0.64" transform="rotate(120 25 75)"/><rect x="21.64" y="57.36" width="6.72" height="17.64" rx="3.36" fill="#2ef06a" opacity="0.76" transform="rotate(180 25 75)"/><rect x="21.64" y="57.36" width="6.72" height="17.64" rx="3.36" fill="#2ef06a" opacity="0.88" transform="rotate(240 25 75)"/><rect x="21.64" y="57.36" width="6.72" height="17.64" rx="3.36" fill="#2ef06a" opacity="1" transform="rotate(300 25 75)"/></g></g>
<g clip-path="url(#clipg)"><text class="display rv " x="64" y="102.5" font-size="64" fill="#ededed" style="animation-delay:0.15s">O</text><text class="display rv " x="95.13" y="102.5" font-size="64" fill="#ededed" style="animation-delay:0.18s">N</text><text class="display rv " x="142" y="102.5" font-size="64" fill="#ededed" style="animation-delay:0.21s">G</text><text class="display rv " x="173.03" y="102.5" font-size="64" fill="#ededed" style="animation-delay:0.24s">I</text><text class="display rv " x="187.53" y="102.5" font-size="64" fill="#ededed" style="animation-delay:0.27s">T</text><text class="display rv " x="212.84" y="102.5" font-size="64" fill="#ededed" style="animation-delay:0.3s">H</text><text class="display rv " x="244.78" y="102.5" font-size="64" fill="#ededed" style="animation-delay:0.33s">U</text><text class="display rv " x="275.09" y="102.5" font-size="64" fill="#ededed" style="animation-delay:0.36s">B</text></g>
<text class="sans aside fu" x="683.94" y="79.5" style="animation-delay:0.5s">Commits, streaks and contributions, refreshed</text><text class="sans aside fu" x="683.94" y="102.5" style="animation-delay:0.56s">automatically.</text>
</svg>
