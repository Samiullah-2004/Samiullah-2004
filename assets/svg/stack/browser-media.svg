<g class="flip" style="transform-origin:662px 114px;animation-delay:2.83s"><svg x="642" y="94" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#2ef06a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 3v18"/><path d="M17 7.5h4"/><path d="M17 16.5h4"/></svg></g>
