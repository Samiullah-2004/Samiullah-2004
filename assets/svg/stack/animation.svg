<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="500" height="214" viewBox="0 0 500 214" role="img" aria-labelledby="title desc">
<title id="title">Animation skills</title>
<desc id="desc">GSAP, Framer Motion, Lenis</desc>
<defs><style>@font-face{font-family:'Anton';src:url(data:font/woff2;base64,) format('woff2')}
.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.display{font-family:'Anton', Impact, 'Arial Narrow Bold', sans-serif}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(112%)}to{transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(1);opacity:.6}70%,100%{transform:scale(3.4);opacity:0}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.fu{animation:fadeUp .9s cubic-bezier(0.16, 1, 0.3, 1) both}
.fi{animation:fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) both}
.rv{transform-box:fill-box;animation:rise 1s cubic-bezier(0.16, 1, 0.3, 1) both}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s cubic-bezier(0,0,.2,1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.idx{font:600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;letter-spacing:.22em;fill:#2ef06a;text-transform:uppercase}
.count{font:600 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;letter-spacing:.22em;fill:#9a9a9a;text-transform:uppercase}
.lb{font-size:13px;font-weight:500;fill:#cfcfcf;text-anchor:middle}
.tile{animation:fadeUp .8s cubic-bezier(0.16, 1, 0.3, 1) both}
.tb{fill:#ffffff;fill-opacity:.025;stroke:#ffffff;stroke-opacity:.08;animation:glow 8s linear infinite both}
.flip{animation:flip 8s linear infinite both}
.beam{animation:beam 8s linear 1.3s infinite both}
@keyframes flip{0%{transform:scaleX(1)}0.38%{transform:scaleX(1)}0.75%{transform:scaleX(1)}1.13%{transform:scaleX(1)}1.5%{transform:scaleX(0.99)}1.88%{transform:scaleX(0.97)}2.25%{transform:scaleX(0.92)}2.63%{transform:scaleX(0.81)}3%{transform:scaleX(0.6)}3.38%{transform:scaleX(0.24)}3.75%{transform:scaleX(-0.24)}4.13%{transform:scaleX(-0.75)}4.5%{transform:scaleX(-1)}4.88%{transform:scaleX(-0.75)}5.25%{transform:scaleX(-0.24)}5.63%{transform:scaleX(0.24)}6%{transform:scaleX(0.6)}6.38%{transform:scaleX(0.81)}6.75%{transform:scaleX(0.92)}7.13%{transform:scaleX(0.97)}7.5%{transform:scaleX(0.99)}7.88%{transform:scaleX(1)}8.25%{transform:scaleX(1)}8.63%{transform:scaleX(1)}9%{transform:scaleX(1)}100%{transform:scaleX(1)}}
@keyframes glow{0%,18%,100%{stroke:#ffffff;stroke-opacity:.08;fill:#ffffff;fill-opacity:.025}3%{stroke:#2ef06a;stroke-opacity:.9;fill:#2ef06a;fill-opacity:.07}}
@keyframes beam{0%{transform:translateX(0)}30%,100%{transform:translateX(670px)}}
</style><clipPath id="card"><rect width="500" height="214" rx="22"/></clipPath>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
<radialGradient id="vignette" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#0a0a0b" stop-opacity="0"/><stop offset=".65" stop-color="#0a0a0b" stop-opacity=".45"/><stop offset="1" stop-color="#0a0a0b" stop-opacity=".9"/></radialGradient><filter id="mono" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0 0 0 0 0.93 0 0 0 0 0.93 0 0 0 0 0.93 0 0 0 1 0"/></filter>
<linearGradient id="beamGrad" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#2ef06a" stop-opacity="0"/><stop offset=".5" stop-color="#2ef06a" stop-opacity=".11"/><stop offset="1" stop-color="#2ef06a" stop-opacity="0"/></linearGradient></defs>
<g clip-path="url(#card)"><rect width="500" height="214" fill="#0a0a0b"/><rect width="500" height="214" fill="url(#grid)"/><rect width="500" height="214" fill="url(#vignette)"/>
<g class="fu" style="animation-delay:.05s">
<text class="idx" x="26" y="45">08</text>
<line x1="55" y1="41" x2="79" y2="41" stroke="#ffffff" stroke-opacity=".2"/>
<text class="display" x="91" y="50" font-size="28" fill="#ededed">ANIMATION</text>
<text class="count" x="474" y="45" text-anchor="end">3 skills</text>
</g>
<g class="tile" style="animation-delay:0.12s">
<rect class="tb" x="26" y="76" width="141.33" height="112" rx="16" style="animation-delay:1.95s"/>
