<text class="sans lb" x="96.67" y="165">GSAP</text>
</g>
<g class="tile" style="animation-delay:0.16s">
<rect class="tb" x="179.33" y="76" width="141.33" height="112" rx="16" style="animation-delay:2.5s"/>
<g class="flip" style="transform-origin:250px 114px;animation-delay:2.5s"><g filter="url(#mono)"><svg x="230" y="94" width="40" height="40" viewBox="0 0 128 128"  overflow="visible"><path d="M22.684 0h84.253v42.667H64.81L22.684 0Zm0 42.667H64.81l42.127 42.666H64.81V128L22.684 85.333V42.667Z"/></svg></g></g>
