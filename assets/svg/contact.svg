<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="555" viewBox="0 0 1000 555" role="img" aria-labelledby="title desc">
<title id="title">Let's build something great</title>
<desc id="desc">Whether it's a full-time remote role, a freelance build or a quick question, my inbox is always open. Email: samiullah.akram.3009@gmail.com</desc>
<defs><style>@font-face{font-family:'Anton';src:url(data:font/woff2;base64,) format('woff2')}
.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.display{font-family:'Anton', Impact, 'Arial Narrow Bold', sans-serif}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(112%)}to{transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(1);opacity:.6}70%,100%{transform:scale(3.4);opacity:0}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.fu{animation:fadeUp .9s cubic-bezier(0.16, 1, 0.3, 1) both}
.fi{animation:fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) both}
.rv{transform-box:fill-box;animation:rise 1s cubic-bezier(0.16, 1, 0.3, 1) both}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s cubic-bezier(0,0,.2,1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.eb{font:600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;letter-spacing:.22em;fill:#9a9a9a;text-transform:uppercase}
.mail{fill:#cfcfcf}
.note{font-size:15.5px;fill:#9a9a9a}
.fact{font-size:15px;fill:#cfcfcf}
@keyframes underline{from{transform:scaleX(0)}to{transform:none}}
.ul{transform-origin:52px 0;animation:underline 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1.3s both}
@keyframes nudge{0%,70%,100%{transform:none}80%{transform:translate(4px,-4px)}}
.nudge{animation:nudge 3.2s ease-in-out 2s infinite}
.blob{animation:breathe 7s ease-in-out infinite}
