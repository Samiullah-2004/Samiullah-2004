<text class="sans stt" x="44" y="330">Payments &amp; SaaS billing</text>
<text class="sans sd" x="44" y="356">Stripe, Flutterwave and Squad with signed webhooks,</text><text class="sans sd" x="44" y="378">idempotent fulfillment, credits, plans and multi-currency pricing.</text>
