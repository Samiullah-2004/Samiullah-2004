<text class="sans sd" x="532" y="356">Design systems and responsive UI, then tests (Jest, Vitest,</text><text class="sans sd" x="532" y="378">Playwright), CI/CD, Docker and deploys to Vercel, Railway and</text><text class="sans sd" x="532" y="400">Hostinger.</text>
