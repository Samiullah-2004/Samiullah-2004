<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="444" viewBox="0 0 1000 444" role="img" aria-labelledby="title desc">
<title id="title">What I do best</title>
<desc id="desc">AI &amp; RAG products: RAG pipelines built from scratch (chunking, embeddings, pgvector search) and LLM features with Gemini, Groq and MiniMax. Real-time systems: WebRTC video, Socket.IO and live AI video streaming with per-second credit billing and clean session recovery. Payments &amp; SaaS billing: Stripe, Flutterwave and Squad with signed webhooks, idempotent fulfillment, credits, plans and multi-currency pricing. Design to deployment: Design systems and responsive UI, then tests (Jest, Vitest, Playwright), CI/CD, Docker and deploys to Vercel, Railway and Hostinger.</desc>
<defs><style>
.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.display{font-family:'Anton', Impact, 'Arial Narrow Bold', sans-serif}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(112%)}to{transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(1);opacity:.6}70%,100%{transform:scale(3.4);opacity:0}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.fu{animation:fadeUp .9s cubic-bezier(0.16, 1, 0.3, 1) both}
.fi{animation:fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) both}
.rv{transform-box:fill-box;animation:rise 1s cubic-bezier(0.16, 1, 0.3, 1) both}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s cubic-bezier(0,0,.2,1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.stt{font-size:17.5px;font-weight:600;fill:#ededed}
.sd{font-size:14.5px;fill:#9a9a9a}
.sc{fill:#ffffff;fill-opacity:.03;stroke:#ffffff;stroke-opacity:.08;animation:actCard 8s ease-in-out infinite both}
.st{fill:#ffffff;fill-opacity:.06;animation:actTile 8s ease-in-out infinite both}
.si{stroke:#ededed;animation:actIcon 8s ease-in-out infinite both}
@keyframes actCard{0%,32%,100%{stroke:#ffffff;stroke-opacity:.08}6%,26%{stroke:#2ef06a;stroke-opacity:.45}}
@keyframes actTile{0%,32%,100%{fill:#ffffff;fill-opacity:.06}6%,26%{fill:#2ef06a;fill-opacity:1}}
@keyframes actIcon{0%,32%,100%{stroke:#ededed}6%,26%{stroke:#0a0a0b}}
</style><clipPath id="card"><rect width="1000" height="444" rx="26"/></clipPath>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
<radialGradient id="vignette" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#0a0a0b" stop-opacity="0"/><stop offset=".65" stop-color="#0a0a0b" stop-opacity=".45"/><stop offset="1" stop-color="#0a0a0b" stop-opacity=".9"/></radialGradient></defs>
<g clip-path="url(#card)"><rect width="1000" height="444" fill="#0a0a0b"/><rect width="1000" height="444" fill="url(#grid)"/><rect width="1000" height="444" fill="url(#vignette)"/><g class="fu" style="animation-delay:0.1s">
